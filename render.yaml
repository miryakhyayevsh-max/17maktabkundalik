services:
  - type: web
    name: 17maktabkundalik
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app create-admin && gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Главный администратор
