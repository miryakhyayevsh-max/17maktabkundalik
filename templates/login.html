{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Вход в электронный дневник</h2>

    <form method="POST">

        <label>Логин</label>

        <input type="text" name="username" placeholder="Введите логин" required>

        <label>Пароль</label>

        <input type="password" name="password" placeholder="Введите пароль" required>

        <button type="submit">Войти</button>

    </form>

</div>

{% endblock %}
