{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Смена пароля</h2>
    <p>Придумайте новый пароль длиной не менее 10 символов.</p>

    <form method="POST">
        <label>Новый пароль</label>
        <input type="password" name="password" required minlength="10">

        <label>Повторите новый пароль</label>
        <input type="password" name="password2" required minlength="10">

        <button type="submit">Сохранить новый пароль</button>
    </form>
</div>
{% endblock %}
