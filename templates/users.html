{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Управление пользователями</h2>

    <form method="POST">
        <label>ФИО</label>
        <input name="full_name" required>

        <label>Логин</label>
        <input name="username" required>

        <label>Временный пароль (минимум 10 символов)</label>
        <input type="password" name="password" minlength="10" required>

        <label>Роль</label>
        <select name="role" required>
            <option>Ученик</option>
            <option>Родитель</option>
            <option>Учитель</option>
            <option>Классный руководитель</option>
            <option>Главный администратор</option>
            <option>Заместитель директора</option>
            <option>Директор</option>
            <option>Психолог</option>
        </select>

        <button type="submit">Создать пользователя</button>
    </form>
</div>

<div class="card">
    <h2>Список пользователей</h2>
    {% for user in users %}
        <p>{{ user.full_name }} — {{ user.role }} ({{ user.username }})</p>
    {% else %}
        <p>Пользователей пока нет.</p>
    {% endfor %}
</div>
{% endblock %}
