{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Управление классами</h2>
    <p>Список классов школы №17</p>

    <form method="POST">
        <label>Название класса</label>
        <input type="text" name="name" placeholder="Например, 7 Г" required>

        <button type="submit">Добавить класс</button>
    </form>
</div>

<div class="card">
    <h2>Классы школы</h2>
    {% for classroom in classes %}
        <p>{{ classroom.name }}</p>
    {% else %}
        <p>Классов пока нет.</p>
    {% endfor %}
</div>
{% endblock %}
